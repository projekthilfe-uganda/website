<ul class="nav justify-content-end">
    {{range .Site.Data.menu.items}}
        <li class="nav-item">
            <a class="nav-link active" href="{{.url}}">
                {{if .icon}}
                    <i class="fa {{.icon}}">&nbsp;</i>
                {{- end -}}
                {{.name -}}
            </a>
            {{- if .children -}}
                <ul class="dropdown-menu">
                    {{ range .children }}
                        <li class="">
                            <a class="nav-link active" href="{{ .url }}">
                                {{ .name }}
                            </a>
                        </li>
                    {{ end }}
                </ul>
            {{- end -}}
        </li>
    {{end}}
</ul>
